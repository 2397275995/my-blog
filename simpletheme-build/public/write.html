<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>写作后台 · Lxy's Blog</title>
    <style>
      * { box-sizing: border-box; }
      :root {
        --bg: #f5f6f7;
        --card: #fff;
        --line: #e6e8eb;
        --text: #1a1a1a;
        --muted: #7a828c;
        --accent: #2f6df6;
        --danger: #d64545;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "PingFang SC",
          "Microsoft Yahei", sans-serif;
      }
      header {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 22px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        z-index: 10;
      }
      header h1 { margin: 0; font-size: 16px; font-weight: 700; }
      header .sp { flex: 1; }
      .tabs { display: flex; gap: 6px; }
      .tab {
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 13.5px;
        cursor: pointer;
      }
      .tab.on { background: #eef2fe; color: var(--accent); border-color: #d6e0fd; font-weight: 600; }
      main { max-width: 1080px; margin: 0 auto; padding: 22px; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 16px;
      }
      .card h2 { margin: 0 0 14px; font-size: 15px; }
      label.f { display: block; margin-bottom: 14px; }
      label.f > span { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
      input[type="text"], textarea, select {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 8px;
        font: inherit;
        background: #fff;
        color: var(--text);
      }
      textarea { resize: vertical; line-height: 1.7; }
      input:focus, textarea:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgb(47 109 246 / 12%);
      }
      .row { display: flex; gap: 14px; }
      .row > * { flex: 1; min-width: 0; }
      .btn {
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
        font-size: 13.5px;
        cursor: pointer;
      }
      .btn:hover { border-color: #cfd4da; }
      .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
      .btn.primary:disabled { opacity: 0.55; cursor: not-allowed; }
      .btn.sm { padding: 4px 10px; font-size: 12.5px; }
      .btn.danger { color: var(--danger); border-color: #f0cfcf; }
      .list { margin: 0; padding: 0; list-style: none; }
      .list li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 2px;
        border-bottom: 1px solid var(--line);
      }
      .list li:last-child { border-bottom: 0; }
      .list .t { flex: 1; min-width: 0; }
      .list .t b { display: block; font-size: 14px; font-weight: 600; }
      .list .t small { color: var(--muted); font-size: 12px; }
      .tag {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 6px;
        background: #eef2fe;
        color: var(--accent);
        font-size: 11.5px;
      }
      .hint { color: var(--muted); font-size: 12.5px; }
      .msg {
        position: fixed;
        right: 20px;
        bottom: 20px;
        padding: 11px 16px;
        border-radius: 10px;
        background: #23262b;
        color: #fff;
        font-size: 13.5px;
        opacity: 0;
        transform: translateY(8px);
        transition: 0.2s;
        pointer-events: none;
        max-width: 380px;
      }
      .msg.show { opacity: 1; transform: translateY(0); }
      .msg.err { background: var(--danger); }
      .empty { padding: 34px 0; text-align: center; color: var(--muted); }
      .status { font-size: 12.5px; color: var(--muted); }
      .status b { color: #12936f; }
      .hide { display: none !important; }
      .editor-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
      .editor-head h2 { margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <h1>写作后台</h1>
      <div class="tabs">
        <button class="tab on" data-view="posts">文章</button>
        <button class="tab" data-view="papers">论文</button>
        <button class="tab" data-view="cats">分类</button>
        <button class="tab" data-view="cfg">设置</button>
      </div>
      <div class="sp"></div>
      <span class="status" id="status">未连接</span>
    </header>

    <main>
      <!-- 文章 -->
      <section id="view-posts">
        <div id="postsList"></div>
      </section>

      <!-- 论文 -->
      <section id="view-papers" class="hide">
        <div id="papersList"></div>
      </section>

      <!-- 分类 -->
      <section id="view-cats" class="hide">
        <div class="card">
          <h2>分类</h2>
          <ul class="list" id="catList"></ul>
          <div class="row" style="margin-top: 16px">
            <input type="text" id="newCatName" placeholder="新分类名称，如：容器" />
            <input type="text" id="newCatSlug" placeholder="slug，如：rongqi（可留空自动生成）" />
            <button class="btn primary" id="addCat" style="flex: 0 0 auto">添加分类</button>
          </div>
          <p class="hint" style="margin: 10px 0 0">
            分类名会显示在首页筛选条上；slug 是网址里那段英文，改了会让旧链接失效。
          </p>
        </div>
      </section>

      <!-- 设置 -->
      <section id="view-cfg" class="hide">
        <div class="card">
          <h2>GitHub 连接</h2>
          <p class="hint" style="margin-top: -6px">
            内容存在你的 GitHub 仓库里，这里填仓库地址和一个 Token。Token 只存在这台浏览器本地，
            不会上传到任何地方。
          </p>
          <label class="f">
            <span>仓库（owner/name）</span>
            <input type="text" id="cfgRepo" placeholder="2397275995/my-blog" />
          </label>
          <div class="row">
            <label class="f">
              <span>分支</span>
              <input type="text" id="cfgBranch" placeholder="main" />
            </label>
            <label class="f">
              <span>content.json 路径</span>
              <input type="text" id="cfgPath" placeholder="admin/content.json" />
            </label>
          </div>
          <label class="f">
            <span>GitHub Token（需要该仓库的 Contents 读写权限）</span>
            <input type="text" id="cfgToken" placeholder="github_pat_..." />
          </label>
          <button class="btn primary" id="saveCfg">保存并连接</button>
          <p class="hint" style="margin-top: 14px">
            Token 生成：GitHub → Settings → Developer settings → Personal access tokens →
            Fine-grained tokens → 只勾选这个仓库，权限选 Contents: Read and write。
          </p>
        </div>
      </section>
    </main>

    <div class="msg" id="msg"></div>

    <script>
      // ============ 基础 ============
      var CFG_KEY = 'blog-writer-cfg';
      var cfg = { repo: '', branch: 'main', path: 'admin/content.json', token: '' };
      var state = { content: null, sha: null, view: 'posts', editing: null };

      function $(s) { return document.querySelector(s); }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      var msgTimer;
      function toast(text, isErr) {
        var el = $('#msg');
        el.textContent = text;
        el.className = 'msg show' + (isErr ? ' err' : '');
        clearTimeout(msgTimer);
        msgTimer = setTimeout(function () { el.className = 'msg'; }, isErr ? 6000 : 3000);
      }
      function setStatus(text, ok) {
        $('#status').innerHTML = ok ? '<b>' + esc(text) + '</b>' : esc(text);
      }

      // ============ 配置 ============
      function loadCfg() {
        try {
          var raw = localStorage.getItem(CFG_KEY);
          if (raw) cfg = Object.assign(cfg, JSON.parse(raw));
        } catch (e) {}
        $('#cfgRepo').value = cfg.repo;
        $('#cfgBranch').value = cfg.branch;
        $('#cfgPath').value = cfg.path;
        $('#cfgToken').value = cfg.token;
      }
      function saveCfg() {
        cfg.repo = $('#cfgRepo').value.trim();
        cfg.branch = $('#cfgBranch').value.trim() || 'main';
        cfg.path = $('#cfgPath').value.trim() || 'admin/content.json';
        cfg.token = $('#cfgToken').value.trim();
        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      }
      function ready() { return cfg.repo && cfg.token; }

      // ============ GitHub API ============
      function apiUrl() {
        return 'https://api.github.com/repos/' + cfg.repo + '/contents/' + cfg.path;
      }
      function headers() {
        return {
          Authorization: 'Bearer ' + cfg.token,
          Accept: 'application/vnd.github+json',
          'X-GitHub-Api-Version': '2022-11-28',
        };
      }
      function b64encode(str) {
        var bytes = new TextEncoder().encode(str);
        var bin = '';
        for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin);
      }
      function b64decode(b64) {
        var bin = atob(String(b64).replace(/\s/g, ''));
        var bytes = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return new TextDecoder('utf-8').decode(bytes);
      }

      function pull() {
        if (!ready()) { setStatus('未连接'); return Promise.resolve(null); }
        setStatus('读取中…');
        return fetch(apiUrl() + '?ref=' + encodeURIComponent(cfg.branch), { headers: headers() })
          .then(function (r) {
            if (!r.ok) throw new Error('读取失败 ' + r.status + '（检查仓库名/分支/Token 权限）');
            return r.json();
          })
          .then(function (data) {
            state.sha = data.sha;
            state.content = JSON.parse(b64decode(data.content));
            setStatus('已连接 · ' + cfg.repo, true);
            render();
            return state.content;
          })
          .catch(function (e) { setStatus('连接失败'); toast(e.message, true); throw e; });
      }

      function push(message) {
        if (!ready()) return Promise.reject(new Error('请先在「设置」里填仓库和 Token'));
        var body = {
          message: message,
          content: b64encode(JSON.stringify(state.content, null, 2)),
          branch: cfg.branch,
          sha: state.sha,
        };
        setStatus('提交中…');
        return fetch(apiUrl(), {
          method: 'PUT',
          headers: headers(),
          body: JSON.stringify(body),
        })
          .then(function (r) {
            if (r.status === 409) throw new Error('仓库已被别处改动，请刷新后重试');
            if (!r.ok) return r.text().then(function (t) { throw new Error('提交失败 ' + r.status + ' ' + t.slice(0, 120)); });
            return r.json();
          })
          .then(function (data) {
            state.sha = data.content.sha;
            setStatus('已保存 · ' + cfg.repo, true);
            toast('已提交到 GitHub，约 3～5 分钟后线上生效');
            return data;
          })
          .catch(function (e) { setStatus('提交失败'); toast(e.message, true); throw e; });
      }

      // ============ 工具 ============
      function slugify(str) {
        var s = String(str || '').trim().toLowerCase();
        s = s.replace(/[\s]+/g, '-').replace(/[^\w\u4e00-\u9fa5-]/g, '').replace(/-+/g, '-');
        return s || 'post-' + Date.now();
      }
      function today() {
        var d = new Date();
        var p = function (n) { return String(n).padStart(2, '0'); };
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':00';
      }
      function nextId(list) {
        return list.reduce(function (m, x) { return Math.max(m, Number(x.id) || 0); }, 0) + 1;
      }

      // ============ 渲染：文章 ============
      function renderPosts() {
        var posts = (state.content.posts || []).slice().sort(function (a, b) {
          return a.date < b.date ? 1 : -1;
        });
        if (state.editing && state.editing.type === 'posts') return renderPostEditor();
        var html = '<div class="card"><div class="editor-head"><h2>文章（' + posts.length + '）</h2>' +
          '<div style="flex:1"></div><button class="btn primary" id="newPost">＋ 写新文章</button></div>';
        if (!posts.length) html += '<div class="empty">还没有文章</div>';
        else {
          html += '<ul class="list">';
          posts.forEach(function (p) {
            html += '<li><div class="t"><b>' + esc(p.title) + '</b><small>' +
              esc(p.date.slice(0, 10)) + ' · ' + esc(p.category || '未分类') +
              (p.published === false ? ' · 草稿' : '') + '</small></div>' +
              '<button class="btn sm" data-edit="' + p.id + '">编辑</button>' +
              '<button class="btn sm danger" data-del="' + p.id + '">删除</button></li>';
          });
          html += '</ul>';
        }
        html += '</div>';
        $('#postsList').innerHTML = html;
        bindList('posts');
        $('#newPost').onclick = function () {
          state.editing = {
            type: 'posts',
            item: { id: nextId(state.content.posts), title: '', slug: '', date: today(), modified: today(),
              category: (state.content.categories[0] || {}).name || '', tags: [], excerpt: '',
              format: 'md', body: '', published: true, cover: '' },
          };
          render();
        };
      }

      function renderPostEditor() {
        var it = state.editing.item;
        var cats = (state.content.categories || []).map(function (c) {
          return '<option value="' + esc(c.name) + '"' + (c.name === it.category ? ' selected' : '') + '>' + esc(c.name) + '</option>';
        }).join('');
        $('#postsList').innerHTML =
          '<div class="card"><div class="editor-head">' +
            '<button class="btn sm" id="back">← 返回</button><h2>' + (it.title ? '编辑文章' : '新文章') + '</h2></div>' +
            '<label class="f"><span>标题</span><input type="text" id="pTitle" value="' + esc(it.title) + '"></label>' +
            '<div class="row">' +
              '<label class="f"><span>网址 slug（留空按标题生成）</span><input type="text" id="pSlug" value="' + esc(it.slug) + '"></label>' +
              '<label class="f"><span>分类</span><select id="pCat">' + cats + '</select></label>' +
              '<label class="f"><span>日期</span><input type="text" id="pDate" value="' + esc(it.date) + '"></label>' +
            '</div>' +
            '<label class="f"><span>摘要（列表页显示的一段话）</span><textarea id="pExcerpt" rows="2">' + esc(it.excerpt) + '</textarea></label>' +
            '<label class="f"><span>正文（Markdown）</span><textarea id="pBody" rows="20">' + esc(it.body) + '</textarea></label>' +
            '<div class="row">' +
              '<label class="f"><span>标签（逗号分隔）</span><input type="text" id="pTags" value="' + esc((it.tags || []).join(', ')) + '"></label>' +
              '<label class="f"><span>封面路径（可留空）</span><input type="text" id="pCover" value="' + esc(it.cover || '') + '" placeholder="/covers/post-21.svg"></label>' +
            '</div>' +
            '<div style="display:flex;gap:10px;align-items:center">' +
              '<button class="btn primary" id="savePost">保存并发布</button>' +
              '<button class="btn" id="saveDraft">存为草稿</button>' +
              '<span class="hint">提交后约 3～5 分钟自动上线</span>' +
            '</div>' +
          '</div>';

        $('#back').onclick = function () { state.editing = null; render(); };
        function collect(published) {
          var item = state.editing.item;
          item.title = $('#pTitle').value.trim();
          item.slug = ($('#pSlug').value.trim() || slugify(item.title));
          item.category = $('#pCat').value;
          item.date = $('#pDate').value.trim() || today();
          item.modified = today();
          item.excerpt = $('#pExcerpt').value.trim();
          item.body = $('#pBody').value;
          item.format = 'md';
          item.tags = $('#pTags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);
          item.cover = $('#pCover').value.trim();
          item.published = published;
          if (!item.title) { toast('标题不能为空', true); return null; }
          return item;
        }
        $('#savePost').onclick = function () { finish(collect(true), '新建文章：'); };
        $('#saveDraft').onclick = function () { finish(collect(false), '保存草稿：'); };

        function finish(item, label) {
          if (!item) return;
          var list = state.content.posts;
          var idx = -1;
          list.forEach(function (x, i) { if (Number(x.id) === Number(item.id)) idx = i; });
          if (idx >= 0) list[idx] = item; else list.push(item);
          push(label + item.title).then(function () {
            state.editing = null;
            render();
          }).catch(function () {});
        }
      }

      // ============ 渲染：论文 ============
      function renderPapers() {
        if (!state.content.papers) state.content.papers = [];
        var list = state.content.papers;
        if (state.editing && state.editing.type === 'papers') return renderPaperEditor();
        var html = '<div class="card"><div class="editor-head"><h2>论文（' + list.length + '）</h2>' +
          '<div style="flex:1"></div><button class="btn primary" id="newPaper">＋ 收录论文</button></div>';
        if (!list.length) html += '<div class="empty">还没有论文</div>';
        else {
          html += '<ul class="list">';
          list.forEach(function (p) {
            html += '<li><div class="t"><b>' + esc(p.title) + '</b><small>' +
              esc(p.category || '未分类') + ' · ' + esc(p.year || '') + ' · 读于 ' + esc(p.readDate || '') +
              '</small></div>' +
              '<button class="btn sm" data-edit="' + p.id + '">编辑</button>' +
              '<button class="btn sm danger" data-del="' + p.id + '">删除</button></li>';
          });
          html += '</ul>';
        }
        html += '</div>';
        $('#papersList').innerHTML = html;
        bindList('papers');
        $('#newPaper').onclick = function () {
          state.editing = {
            type: 'papers',
            item: { id: nextId(list), title: '', authors: '', venue: '', year: '',
              category: '', summary: '', url: '', tags: [], readDate: '' },
          };
          render();
        };
      }

      function renderPaperEditor() {
        var it = state.editing.item;
        $('#papersList').innerHTML =
          '<div class="card"><div class="editor-head">' +
            '<button class="btn sm" id="back">← 返回</button><h2>' + (it.title ? '编辑论文' : '收录新论文') + '</h2></div>' +
            '<label class="f"><span>标题</span><input type="text" id="qTitle" value="' + esc(it.title) + '"></label>' +
            '<div class="row">' +
              '<label class="f"><span>作者</span><input type="text" id="qAuthors" value="' + esc(it.authors) + '"></label>' +
              '<label class="f"><span>期刊 / 会议</span><input type="text" id="qVenue" value="' + esc(it.venue) + '"></label>' +
            '</div>' +
            '<div class="row">' +
              '<label class="f"><span>年份</span><input type="text" id="qYear" value="' + esc(it.year) + '"></label>' +
              '<label class="f"><span>方向分类</span><input type="text" id="qCat" value="' + esc(it.category) + '" placeholder="如：知识图谱"></label>' +
              '<label class="f"><span>阅读日期</span><input type="text" id="qDate" value="' + esc(it.readDate) + '" placeholder="2026-11-02"></label>' +
            '</div>' +
            '<label class="f"><span>一句话结论</span><textarea id="qSum" rows="3">' + esc(it.summary) + '</textarea></label>' +
            '<div class="row">' +
              '<label class="f"><span>原文链接</span><input type="text" id="qUrl" value="' + esc(it.url) + '"></label>' +
              '<label class="f"><span>标签（逗号分隔）</span><input type="text" id="qTags" value="' + esc((it.tags || []).join(', ')) + '"></label>' +
            '</div>' +
            '<button class="btn primary" id="savePaper">保存</button>' +
          '</div>';

        $('#back').onclick = function () { state.editing = null; render(); };
        $('#savePaper').onclick = function () {
          var item = state.editing.item;
          item.title = $('#qTitle').value.trim();
          if (!item.title) return toast('标题不能为空', true);
          item.authors = $('#qAuthors').value.trim();
          item.venue = $('#qVenue').value.trim();
          item.year = $('#qYear').value.trim();
          item.category = $('#qCat').value.trim();
          item.readDate = $('#qDate').value.trim();
          item.summary = $('#qSum').value.trim();
          item.url = $('#qUrl').value.trim();
          item.tags = $('#qTags').value.split(/[,，]/).map(function (s) { return s.trim(); }).filter(Boolean);

          var list = state.content.papers;
          var idx = -1;
          list.forEach(function (x, i) { if (Number(x.id) === Number(item.id)) idx = i; });
          if (idx >= 0) list[idx] = item; else list.push(item);
          push('收录论文：' + item.title).then(function () { state.editing = null; render(); }).catch(function () {});
        };
      }

      // ============ 渲染：分类 ============
      function renderCats() {
        var cats = state.content.categories || [];
        $('#catList').innerHTML = cats.map(function (c) {
          var count = (state.content.posts || []).filter(function (p) { return p.category === c.name; }).length;
          return '<li><div class="t"><b>' + esc(c.name) + '</b><small>' + esc(c.slug) + ' · ' + count + ' 篇</small></div>' +
            '<button class="btn sm danger" data-delcat="' + c.id + '">删除</button></li>';
        }).join('') || '<li class="empty">还没有分类</li>';

        Array.prototype.forEach.call(document.querySelectorAll('[data-delcat]'), function (el) {
          el.onclick = function () {
            var id = Number(el.getAttribute('data-delcat'));
            var cat = cats.filter(function (c) { return Number(c.id) === id; })[0];
            if (!cat) return;
            if (!confirm('删除分类「' + cat.name + '」？文章本身不会删，但会变成未分类。')) return;
            state.content.categories = cats.filter(function (c) { return Number(c.id) !== id; });
            push('删除分类：' + cat.name).then(function () { render(); }).catch(function () {});
          };
        });
        $('#addCat').onclick = function () {
          var name = $('#newCatName').value.trim();
          if (!name) return toast('分类名称不能为空', true);
          var slug = $('#newCatSlug').value.trim() || slugify(name);
          if ((state.content.categories || []).some(function (c) { return c.name === name || c.slug === slug; })) {
            return toast('这个分类已存在', true);
          }
          state.content.categories.push({ id: nextId(state.content.categories), name: name, slug: slug });
          push('新增分类：' + name).then(function () {
            $('#newCatName').value = '';
            $('#newCatSlug').value = '';
            render();
          }).catch(function () {});
        };
      }

      // ============ 列表事件 ============
      function bindList(kind) {
        Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function (el) {
          el.onclick = function () {
            var id = Number(el.getAttribute('data-edit'));
            var item = state.content[kind].filter(function (x) { return Number(x.id) === id; })[0];
            if (!item) return;
            state.editing = { type: kind, item: JSON.parse(JSON.stringify(item)) };
            render();
          };
        });
        Array.prototype.forEach.call(document.querySelectorAll('[data-del]'), function (el) {
          el.onclick = function () {
            var id = Number(el.getAttribute('data-del'));
            var item = state.content[kind].filter(function (x) { return Number(x.id) === id; })[0];
            if (!item) return;
            if (!confirm('确定删除「' + (item.title || item.name) + '」？')) return;
            state.content[kind] = state.content[kind].filter(function (x) { return Number(x.id) !== id; });
            push('删除：' + (item.title || item.name)).then(function () { render(); }).catch(function () {});
          };
        });
      }

      // ============ 视图切换 ============
      function render() {
        if (!state.content) {
          $('#postsList').innerHTML = '<div class="card"><div class="empty">还没有连接 GitHub。<br><br>' +
            '先去「设置」填仓库和 Token，或者点这里 <button class="btn sm" id="goCfg">去设置</button></div></div>';
          $('#papersList').innerHTML = '';
          $('#catList').innerHTML = '';
          var g = $('#goCfg');
          if (g) g.onclick = function () { switchView('cfg'); };
          return;
        }
        if (state.view === 'posts') renderPosts();
        if (state.view === 'papers') renderPapers();
        if (state.view === 'cats') renderCats();
      }

      function switchView(v) {
        state.view = v;
        state.editing = null;
        Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
          t.classList.toggle('on', t.getAttribute('data-view') === v);
        });
        ['posts', 'papers', 'cats', 'cfg'].forEach(function (k) {
          var el = $('#view-' + k);
          if (el) el.classList.toggle('hide', k !== v);
        });
        if (v !== 'cfg') render();
      }

      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
        t.onclick = function () { switchView(t.getAttribute('data-view')); };
      });
      $('#saveCfg').onclick = function () {
        saveCfg();
        if (!ready()) return toast('仓库和 Token 都要填', true);
        pull().then(function () { switchView('posts'); }).catch(function () {});
      };

      // ============ 启动 ============
      loadCfg();
      if (ready()) {
        pull().catch(function () { switchView('cfg'); });
      } else {
        setStatus('未连接');
        switchView('cfg');
      }
    </script>
  </body>
</html>
